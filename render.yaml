# Render Blueprint — lets Render auto-detect and deploy the backend
# from this repo with one click ("New > Blueprint" on render.com).
services:
  - type: web
    name: archidev-finance-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false   # set manually to your Neon/Supabase connection string
      - key: CORS_ORIGINS
        sync: false   # set manually to your Vercel frontend URL once deployed
      - key: ANTHROPIC_API_KEY
        sync: false   # optional
